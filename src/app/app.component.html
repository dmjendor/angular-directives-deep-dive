   <span> Structural Directive </span>

  <!-- Items inside ng-template will NOT show on screen initially the * is just syntactic sugar for angular to automatically add ng-template around that element -->
  <!-- <ng-template appAuth="admin">
    <p>Only admins should see this!</p>

  <p *appAuth="'admin'" class="protected-content admin">

  </p>
  <p *appAuth="'user'" class="protected-content authenticated">

  </p>
  <p *appAuth="'guest'" class="protected-content unauthenticated">
    Guests should see this!
  </p>
</main>
